<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Indigo to Violet Gradient -->
    <linearGradient id="indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Synapse Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container App Icon -->
  <rect width="128" height="128" rx="32" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" />

  <!-- Ambient Glow Behind Avatar Headwear -->
  <circle cx="64" cy="64" r="32" fill="#6366f1" opacity="0.15" filter="url(#neon-glow)" />

  <!-- 3D Student Diamond Mortarboard Rhombus Top -->
  <path d="M 64 26 L 102 44 L 64 62 L 26 44 Z" fill="url(#indigo-grad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#neon-glow)" />
  
  <!-- Mortarboard Cap Skull Cap Base -->
  <path d="M 40 51 L 40 66 C 40 76 88 76 88 66 L 88 51" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />

  <!-- Golden Tassel & Hanging Cord -->
  <path d="M 64 44 L 94 48 L 96 74" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="96" cy="76" r="3.5" fill="url(#gold-grad)" filter="url(#neon-glow)" />

  <!-- Stylized 3D Student Head / Focus Core -->
  <circle cx="64" cy="80" r="16" fill="#0f172a" stroke="url(#cyan-glow)" stroke-width="2" />

  <!-- 3D Student Smart Headphone Arc -->
  <path d="M 44 80 C 44 68 84 68 84 80" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <rect x="42" y="74" width="5" height="12" rx="2.5" fill="url(#cyan-glow)" filter="url(#neon-glow)" />
  <rect x="81" y="74" width="5" height="12" rx="2.5" fill="url(#cyan-glow)" filter="url(#neon-glow)" />

  <!-- Synaptic Radiance Arc -->
  <path d="M 48 104 Q 64 96 80 104" fill="none" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="64" cy="100" r="2.5" fill="#38bdf8" filter="url(#neon-glow)" />
</svg>